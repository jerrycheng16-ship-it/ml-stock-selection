name: Daily WSJ Briefing Deploy

on:
  schedule:
    # 每天 UTC 23:00 執行 (相當於台灣時間每日早上 07:00)
    - cron: '0 23 * * *'
  workflow_dispatch: # 支援手動點擊觸發

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 賦予 GitHub Actions 寫入與提交修改的權限

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-generativeai

      - name: Generate Daily Report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_daily.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "auto: update daily briefing [$(date +'%Y-%m-%d')]" || exit 0
          git push
